# cargo-deny : audit des dépendances (licences, vulnérabilités, sources).
# CI : `cargo deny check licenses advisories sources` (voir .github/workflows/build.yml)

[graph]
# DFWLogger est une application exclusivement Windows x64 (APIs Win32 / Kernel).
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
yanked = "warn"
unmaintained = "none"
ignore = [
    # RUSTSEC-2026-0257 : Spécifique à Unix (webbrowser/src/unix.rs) ; DFWLogger tourne uniquement sous Windows.
    "RUSTSEC-2026-0257",
    # RUSTSEC-2026-0194 : quick-xml (utilisé en local pour le parsing de l'event 4625 Windows)
    "RUSTSEC-2026-0194",
    # rustls / rustls-webpki : DFWLogger n'utilise rustls qu'en serveur HTTPS LAN avec certificat auto-signé en mémoire.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

# Clarification pour epaint (police Ubuntu / Noto embarquée dans egui)
[[licenses.clarify]]
name = "epaint"
expression = "MIT OR Apache-2.0"
license-files = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
