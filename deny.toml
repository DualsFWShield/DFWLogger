# cargo-deny : audit des dépendances (licences, vulnérabilités, sources).
# CI : `cargo deny check licenses advisories sources` (voir .github/workflows/build.yml)

[graph]
# DFWLogger est une application exclusivement Windows x64 (APIs Win32 / Kernel).
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
yanked = "warn"
unmaintained = "warn"
notice = "warn"
ignore = [
    # RUSTSEC-2026-0257 : Spécifique à Unix (webbrowser/src/unix.rs) ; DFWLogger tourne uniquement sous Windows.
    "RUSTSEC-2026-0257",
    # RUSTSEC-2026-0382 : Intermédiaires emSign dans webpki ; DFWLogger n'utilise rustls qu'en serveur LAN avec certificat auto-signé.
    "RUSTSEC-2026-0382",
    # RUSTSEC-2026-0192 : ttf-parser déprécié (dépendance transitive d'egui 0.27 / ab_glyph, aucun upgrade compatible).
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Clarification pour epaint (police Ubuntu / Noto embarquée dans egui)
[[licenses.clarify]]
name = "epaint"
expression = "MIT OR Apache-2.0"
license-files = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
